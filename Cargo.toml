[package]
name = "valence"
version = "0.1.4"
edition = "2021"
description = "Lineage Valence – L2 node for E2E-encrypted peer data exchange (from AIBlock Valence)."
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/lineage-foundation/valence"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.73"
axum = "0.7"
chrono = "0.4.26"
config = "0.14"
dotenvy = "0.15.7"
hex = "0.4.3"
redis = { version = "0.26", features = ["aio", "connection-manager", "tokio-comp"] }
serde = { version = "1.0.173", features = ["derive"] }
serde_json = { version = "1.0.103", features = ["preserve_order"] }
tokio = { version = "1.29.1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "limit"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
tw_chain = "1.1.3"
